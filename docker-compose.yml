services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: duck_store
      MYSQL_USER: duck_store
      MYSQL_PASSWORD: duck_store
    ports:
      - '3307:3306'
    volumes:
      - duck-store-mysql-data:/var/lib/mysql
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: duck_store
      DB_PASSWORD: duck_store
      DB_NAME: duck_store
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  duck-store-mysql-data:
